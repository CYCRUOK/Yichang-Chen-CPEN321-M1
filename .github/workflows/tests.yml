name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Interface tests (mock + no-mock) and unit tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info

  frontend-unit:
    name: Frontend (host unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          API_BASE_URL=https://8-229-19-28.sslip.io
          GOOGLE_CLIENT_ID=
          EOF
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-unit-test-reports
          path: frontend/app/build/reports/tests/testDebugUnitTest
